management:
  server:
    port: 0   # porta aleatória: o actuator só existe na porta de gerenciamento
  endpoints:
    web:
      exposure:
        include: health,prometheus,info   # info existe só para provar que a porta de gerenciamento o nega
app:
  product-sync:
    initial-delay-ms: 86400000
  jwt:
    secret: test-only-secret-with-at-least-32-bytes-0123456789
