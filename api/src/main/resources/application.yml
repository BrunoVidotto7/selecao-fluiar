server:
  forward-headers-strategy: native   # Tomcat só aceita o X-Forwarded-For de proxies internos (loopback e faixas privadas)
spring:
  application:
    name: selecao-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/selecao}
    username: ${DB_USERNAME:selecao}
    password: ${DB_PASSWORD:selecao}
    hikari:
      data-source-properties:
        logServerErrorDetail: false   # o log de erro do banco não repete os valores da linha (ex.: o e-mail duplicado)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100   # carrega ambientes -> produtos -> links em lote (evita N+1)
  jackson:
    deserialization:
      accept-float-as-int: false   # quantidade 1.9 vira erro 400, em vez de ser salva como 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:                       # milissegundos; sem isso um SMTP travado prende a requisição para sempre
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}   # true nos provedores que exigem STARTTLS (ex.: porta 587)
management:
  server:
    port: ${MANAGEMENT_PORT:8081}   # o actuator só existe nesta porta: ela deve ficar interna (fora do balanceador)
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness e /readiness; o readiness só olha o banco
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,prometheus   # só na porta de gerenciamento
  health:
    mail:
      enabled: false   # um SMTP fora do ar não deve derrubar a API nem tirá-la do balanceador
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 12h
    remember-me-ttl: 30d
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  time-zone: America/Sao_Paulo
  mail-from: ${MAIL_FROM:nao-responda@fluiar.com.br}
